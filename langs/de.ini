; Nitshot - Deutsch
;
; Siehe en.ini für die Regeln. Kurz:
;   * UTF-8 speichern, nur den Text hinter "=" übersetzen.
;   * "&" markiert den Tastaturkürzel-Buchstaben; im Einstellungsfenster darf
;     kein Buchstabe zweimal vorkommen.
;   * %1, %2 sind Platzhalter und dürfen umgestellt werden - TOAST_RECORDED
;     macht hier genau das.
;   * Produktnamen bleiben englisch: Nitshot, Snip, HDR, PrtScn,
;     Win+Shift+S, .jxr, .png, .wav, .mp4, H.264, HEVC, GDI.

[Strings]

; ---- Tray-Menü ----
MENU_SNIP          = &Neuer Snip\tWin+Shift+S
MENU_FULLSCREEN    = &Ganzen Bildschirm aufnehmen
MENU_OPENFOLDER    = Screenshot-&Ordner öffnen
MENU_AUTOSTART     = Mit &Windows starten
MENU_SETTINGS      = &Einstellungen...
MENU_ABOUT         = &Info
MENU_EXIT          = &Beenden
TRAY_TIP           = Win+Shift+S oder PrtScn zum Aufnehmen

; ---- nach einem Snip ----
TOAST_COPIED_SAVED = Kopiert und gespeichert als\n%1
TOAST_SAVED        = Gespeichert als\n%1
TOAST_COPIED       = In die Zwischenablage kopiert.
TOAST_NOTHING      = Nichts gespeichert – bitte Einstellungen prüfen.
TOAST_HDR          = \nHDR
TOAST_HDR_SDR      = \nHDR, mit SDR-Kopie daneben
TOAST_ENCODE       = \nKodierung %1 ms

; ---- nach einer Aufnahme ----
; Andere Reihenfolge als im Englischen, und genau dafür sind die Platzhalter da.
TOAST_RECORDED     = %1 aufgenommen nach\n%2
TOAST_RECORD_WAV   = \nmit verlustfreier .wav daneben
TOAST_RECORD_FAIL  = Die Aufnahme ist fehlgeschlagen.\n%1

; ---- Fehler ----
MSG_RECORD_START   = Die Aufnahme konnte nicht gestartet werden.
MSG_CAPTURE_FAILED = Der Bildschirm konnte nicht aufgenommen werden.
MSG_SAVE_FAILED    = Der Snip konnte nicht gespeichert werden.
MSG_FOLDER_FAILED  = Der Screenshot-Ordner konnte nicht angelegt werden.
MSG_HOOK_FAILED    = Der Tastatur-Hook konnte nicht installiert werden, Win+Shift+S und PrtScn werden daher nicht abgefangen.\n\n%1 läuft weiter; zum Aufnehmen das Tray-Symbol benutzen.
ERR_NO_ENCODER     = Kein Video-Encoder verfügbar.
ERR_NO_DISPLAY     = Kein Display konnte aufgenommen werden.
ERR_AREA_SMALL     = Der Bereich ist zu klein für eine Aufnahme.
ERR_HDR_SETUP      = Die HDR-Umwandlung konnte nicht eingerichtet werden.
ERR_CAPTURE_BUF    = Der Aufnahmepuffer konnte nicht angelegt werden.
ERR_FILE_CREATE    = Die Videodatei konnte nicht erstellt werden.
ERR_ENC_FORMAT     = Der Video-Encoder hat das Aufnahmeformat abgelehnt.
ERR_ENC_START      = Der Encoder ließ sich nicht starten.
ERR_FINALISE       = Die Datei konnte nicht abgeschlossen werden.

; ---- Info ----
ABOUT_BODY         = Ein kleiner nativer Ersatz für das Windows Snipping Tool.\n\nWin+Shift+S\tCapture-Overlay öffnen\nPrtScn\t\tdasselbe\n\nScreenshots landen in:\n%1\n\nCopyright © 2026 Rekow IT

; ---- Einstellungsfenster ----
DLG_CAPTION        = Nitshot – Einstellungen
TAB_GENERAL        = Allgemein
TAB_HDR            = HDR
TAB_RECORD         = Aufnahme
TAB_HOTKEYS        = Tastenkürzel
TAB_ADVANCED       = Erweitert

UI_COPYCLIP        = Jeden Snip in die &Zwischenablage kopieren
UI_SAVEDISK        = &Dateien speichern
UI_FOLDER          = &Bilder:
UI_BROWSE          = Du&rchsuchen...
UI_VIDFOLDER       = &Videos:
UI_VIDBROWSE       = Durch&suchen...
UI_BROWSE_PICS     = Wohin sollen Snips gespeichert werden?
UI_BROWSE_VIDS     = Wohin sollen Aufnahmen gespeichert werden?
UI_HOOKWSS         = Win+&Shift+S übernehmen
UI_HOOKPRTSC       = &PrtScn übernehmen
UI_PRTSCFULL       = PrtScn &nimmt den ganzen Bildschirm ohne Overlay auf
UI_DIM             = Des&ktop abdunkeln um
UI_PERCENT         = Prozent
UI_TOAST           = Be&nachrichtigung anzeigen, wenn ein Snip gespeichert wurde
UI_JXR             = HDR-Snips als .&jxr speichern
UI_SIDECAR         = ...und eine SDR-Kopie als .png daneben
UI_ROLLOFF         = Lichter in der 8-Bit-Kopie &erhalten
UI_QUALITY         = &Qualität
UI_RECAUDIO        = &Ton:
UI_RECFPS          = Bilder pro Sek&unde:
UI_RECENC          = &Encoder:
UI_RECHDR          = In HDR &aufnehmen, wenn das Display in HDR läuft
UI_RECWAV          = Ton als verlustfreie .&wav neben der .mp4 speichern
UI_RECMUX          = ...und daraus den Ton der .mp4 erzeugen (nur die .mp4 bleibt)
UI_LANGUAGE        = Spra&che:
UI_AUTOSTART       = &Mit Windows starten
UI_DEBUGLOG        = Diagnose-&Log
UI_FORCEGDI        = Immer &GDI-Aufnahme verwenden
UI_FORCESDR        = HDR &ignorieren, 8-Bit aufnehmen
UI_OK              = OK
UI_CANCEL          = Abbrechen
UI_APPLY           = &Übernehmen

AUDIO_NONE         = Kein
AUDIO_SYSTEM       = Systemklang
AUDIO_MIC          = Mikrofon
ENC_AUTO           = Automatisch (bestmöglich)
ENC_H264           = H.264, 8 Bit
ENC_HEVC8          = HEVC, 8 Bit
ENC_HEVC10         = HEVC, 10 Bit HDR
ENC_SOFTWARE       = Software
ENC_HARDWARE       =  (Hardware)
LANG_AUTO          = Automatisch (Windows-Einstellung)
HDR_STATUS_ON      = Erweiterte Farben sind aktiv. SDR-Weiß liegt bei %1 nits, Snips werden daher in Fließkomma aufgenommen.
HDR_STATUS_OFF     = Kein Display nutzt erweiterte Farben, Snips werden daher als normale 8-Bit-Bilder aufgenommen.
