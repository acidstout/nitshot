TOAST_RECORD_FAIL  = The recording failed.\n%1

; ---- things that went wrong ----
MSG_RECORD_START   = The recording could not be started.
MSG_CAPTURE_FAILED = The screen could not be captured.
MSG_SAVE_FAILED    = The snip could not be saved.
MSG_FOLDER_FAILED  = The screenshots folder could not be created.
MSG_HOOK_FAILED    = The keyboard hook could not be installed, so Win+Shift+S and PrtScn will not be captured.\n\n%1 will keep running; use the tray icon to capture.
ERR_NO_ENCODER     = No video encoder is available.
ERR_NO_DISPLAY     = No display could be captured.
ERR_AREA_SMALL     = The area is too small to record.
ERR_HDR_SETUP      = The HDR conversion could not be set up.
ERR_CAPTURE_BUF    = The capture buffer could not be made.
ERR_FILE_CREATE    = The video file could not be created.
ERR_ENC_FORMAT     = The video encoder refused the recording format.
ERR_ENC_START      = The encoder refused to start.
ERR_FINALISE       = The file could not be finalised.

